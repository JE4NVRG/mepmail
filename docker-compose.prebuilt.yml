# Unsupported prebuilt-image override for operators that publish their own
# private image. The supported path for this fork is the root compose file's
# local source build. Private-registry usage:
#   docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up
# Set MEPMAIL_IMAGE explicitly, preferably to an immutable @sha256 digest.
services:
  mepmail:
    image: "${MEPMAIL_IMAGE:?Set MEPMAIL_IMAGE to an operator-published private image}"
    build: !reset null
  smtp:
    image: "${MEPMAIL_IMAGE:?Set MEPMAIL_IMAGE to an operator-published private image}"
    build: !reset null
  docs:
    image: "${MEPMAIL_IMAGE:?Set MEPMAIL_IMAGE to an operator-published private image}"
    build: !reset null

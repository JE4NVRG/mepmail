name: ci
# A dispatched candidate check is named after its commit, so the release script can find
# it; every other run keeps GitHub's default title.
run-name: ${{ inputs.sha && format('candidate {0}', inputs.sha) || '' }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A release candidate (a commit not yet on main) is checked here before it ships:
  # the maintainer pushes it to a candidates ref and runs this with its sha.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to check (defaults to the selected ref)"
        required: false
        default: ""

permissions:
  contents: read

env:
  APP_IMAGE: ghcr.io/je4nvrg/mepmail
  BACKUP_IMAGE: ghcr.io/je4nvrg/mepmail-backup

# A newer push supersedes a PR's run, but never an in-flight publish on main:
# cancelling one would leave the moving tags pointing at an older build.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # --continue: one run reports every package's failures, not just the first one.
      - run: pnpm exec turbo run test --continue
      # Not a drizzle-kit snapshot diff: hand-written migrations and Correio's own chain
      # keep no snapshot. The test suites above apply both chains to a real database.
      - name: Migration journals match their files
        run: node scripts/check-migration-journals.mjs

  # Whole-history secret scan with the pinned gitleaks image (the GitHub
  # action needs a license key for organization repos; the CLI does not).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1 /repo

  # Images publish only from a green check on a version tag, so a tag a
  # deployment tracks can never point at a build the tests rejected. Version
  # tags → :1.2.3, :1.2 and :latest (metadata-action adds :latest to semver
  # tags by itself). Pushes to main are checked but publish no image.
  #
  # Each platform builds on its own native runner — the Next.js build under
  # QEMU emulation was the whole cost of a multi-arch build — and pushes by
  # digest only; publish then stitches the digests into one tag per image.
  build:
    needs: [check, secrets]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only here (they link the package to this repository); tags are
      # applied to the merged manifest in publish.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.APP_IMAGE }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: app
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.APP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.slug }}
          cache-to: type=gha,scope=app-${{ matrix.slug }},mode=max
      # The backup sidecar (pg_dump + rclone) ships on the same tags so the
      # standalone compose file needs no build context.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: backup
        with:
          context: scripts/backup
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.BACKUP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=backup-${{ matrix.slug }}
          cache-to: type=gha,scope=backup-${{ matrix.slug }},mode=max
      - name: Export digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          mkdir -p /tmp/digests/app /tmp/digests/backup
          touch "/tmp/digests/app/${APP_DIGEST#sha256:}" "/tmp/digests/backup/${BACKUP_DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: app
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: backup
        with:
          images: ${{ env.BACKUP_IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-arch manifests
        env:
          APP_META: ${{ steps.app.outputs.json }}
          BACKUP_META: ${{ steps.backup.outputs.json }}
        run: |
          cd /tmp/digests/app
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$APP_META") $(printf "$APP_IMAGE@sha256:%s " *)
          cd /tmp/digests/backup
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$BACKUP_META") $(printf "$BACKUP_IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<<"$APP_META")"

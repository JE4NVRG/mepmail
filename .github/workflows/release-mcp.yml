name: release-mcp

# Publishes packages/mcp (@mepmail/mcp) at its current version to npm via
# Trusted Publishing (OIDC): configure npmjs.com → package @mepmail/mcp →
# Settings → Trusted Publisher → GitHub Actions, repo JE4NVRG/mepmail,
# workflow release-mcp.yml. No token stored. npm only lets a Trusted Publisher
# be configured on a package that already exists, so the very first version
# is published by a maintainer from a laptop (`npm publish` in packages/mcp);
# every later version goes through this workflow.
on:
  workflow_dispatch:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag publishes exactly the version packages/mcp declares; a tag that
      # disagrees with it is refused instead of shipping the wrong number.
      - name: Tag must match the MCP manifest version
        if: github.ref_type == 'tag'
        run: test "mcp-v$(node -p "require('./packages/mcp/package.json').version")" = "$GITHUB_REF_NAME"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The MCP server's tests are the gate before anything reaches npm.
      - run: pnpm --filter @mepmail/mcp typecheck
      - run: pnpm --filter @mepmail/mcp test
      # npm ≥ 11.5.1 exchanges the OIDC token itself; publish runs
      # prepublishOnly (esbuild bundle).
      - run: npm install -g npm@11.8.0
      - run: npm publish
        working-directory: packages/mcp

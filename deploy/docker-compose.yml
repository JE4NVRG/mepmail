# Legacy standalone compose definition, retained for operators that publish
# their own private images. It is not a supported installation or release
# channel for this fork. Use the root docker-compose.yml and build from source.
# If you maintain this file privately, set MILLIONSEND_IMAGE and
# MILLIONSEND_BACKUP_IMAGE explicitly, preferably to immutable @sha256 digests.
#
# Optional services sit behind compose profiles — COMPOSE_PROFILES in .env:
#   docs    the documentation site on DOCS_PORT
#   smtp    the SMTP relay; mount a STARTTLS keypair first (SELF_HOSTING.md)
#   backup  scheduled pg_dump to S3-compatible storage; needs S3_BACKUP_BUCKET
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    # Three app pools plus the queue's own would exceed the 100 default; unused slots cost nothing.
    # No parallel query: a queue fetch must never go parallel, a two-core box gains nothing from it,
    # and a bad plan then costs one core instead of all of them.
    command: ["postgres", "-c", "max_connections=200", "-c", "max_parallel_workers_per_gather=0"]
    environment:
      POSTGRES_USER: millionsend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-millionsend}
      POSTGRES_DB: millionsend
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millionsend -d millionsend"]
      interval: 5s
      timeout: 5s
      retries: 10

  millionsend:
    image: "${MILLIONSEND_IMAGE:?Set MILLIONSEND_IMAGE to an operator-published private image}"
    env_file: .env
    environment:
      PROCESS: all
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000" # web dashboard
      - "${API_BIND_ADDRESS:-127.0.0.1}:${PORT:-3001}:${PORT:-3001}" # api
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Above the supervisor's 35 s child-exit budget (scripts/start.mjs).
    stop_grace_period: 45s
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
      - /app/apps/docs/.next/cache
      - /app/apps/docs/.source

  docs:
    image: "${MILLIONSEND_IMAGE:?Set MILLIONSEND_IMAGE to an operator-published private image}"
    env_file: .env
    environment:
      PROCESS: docs
    ports:
      # The docs process is fixed at 3002 inside the container; static content, no database.
      - "${DOCS_BIND_ADDRESS:-127.0.0.1}:${DOCS_PORT:-3002}:3002" # documentation site
    profiles: ["docs"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
      - /app/apps/docs/.next/cache
      - /app/apps/docs/.source

  smtp:
    image: "${MILLIONSEND_IMAGE:?Set MILLIONSEND_IMAGE to an operator-published private image}"
    env_file: .env
    environment:
      PROCESS: smtp
    ports:
      - "${SMTP_BIND_ADDRESS:-127.0.0.1}:${SMTP_PORT:-2587}:${SMTP_PORT:-2587}" # smtp relay
    # Opt-in: without a mounted STARTTLS keypair the relay refuses to start,
    # and an always-on service would restart-loop from the first boot.
    profiles: ["smtp"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
      - /app/apps/docs/.next/cache
      - /app/apps/docs/.source

  backup:
    # Must be built and published by the operator from scripts/backup.
    image: "${MILLIONSEND_BACKUP_IMAGE:?Set MILLIONSEND_BACKUP_IMAGE to an operator-published private image}"
    env_file: .env
    # Stays a no-op (prints a hint, exits 0, restart "no") until
    # S3_BACKUP_BUCKET and the S3_* credentials are set in .env.
    profiles: ["backup"]
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    volumes:
      # pg_dump stages the dump on disk before upload; a volume rather than
      # tmpfs so a large database does not land in RAM.
      - backup-scratch:/tmp
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  backup-scratch:
